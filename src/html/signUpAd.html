<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VetCare - Đăng Nhập Quản Trị</title>
    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <!-- CSS (Lùi ra 1 cấp) -->
    <link rel="stylesheet" href="../css/signUpAd.css" />
  </head>
  <body class="login-root">
    <div class="auth-card">
      <div class="text-center space-y-2 mb-6">
        <div
          class="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto text-3xl font-bold"
        >
          <i class="ri-shield-user-line"></i>
        </div>
        <h2 class="text-2xl font-extrabold text-slate-800">
          Đăng Nhập Quản Trị
        </h2>
        <p class="text-xs text-slate-500">
          Tài khoản: <b>admin</b> / Mật khẩu: <b>123</b>
        </p>
      </div>

      <form id="admin-login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1"
            >Tài khoản</label
          >
          <input type="text" id="admin-user" required class="auth-input" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1"
            >Mật khẩu</label
          >
          <input type="password" id="admin-pass" required class="auth-input" />
        </div>
        <button
          type="submit"
          class="w-full py-2.5 bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold rounded-lg shadow-md transition"
        >
          Đăng Nhập Quản Trị
        </button>
      </form>
    </div>

    <!-- JS (Lùi ra 1 cấp) -->
    <script src="../js/core/storage.js"></script>
    <script src="../js/pages/auth.js"></script>
  </body>
</html>
