<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PETPET - Trang quản trị</title>
    <link
      rel="shortcut icon"
      href="../img/icon/favicon.ico"
      type="image/x-icon"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/admin.css" />
    <link rel="stylesheet" href="../css/utilities.css" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="sidebar" id="sidebar">
        <div class="logo">
          <span class="logo-mark"
            ><img src="../img/icon/favicon.ico" alt=""
          /></span>
          <div>
            <h2>PETPET</h2>
            <p>ADMIN CENTER</p>
          </div>
        </div>

        <nav>
          <p class="menu-label">TỔNG QUAN</p>
          <button
            class="menu-item active"
            data-title="Tổng quan"
            data-page="tongQuan"
          >
            <div class="menu-icon flexRow-center">
              <i class="ri-home-3-line"></i>
            </div>
            <span class="menu-text">Tổng quan</span>
          </button>

          <p class="menu-label">QUẢN LÝ</p>
          <button class="menu-item" data-title="Đơn hàng" data-page="donHang">
            <div class="menu-icon flexRow-center">
              <i class="ri-suitcase-line"></i>
            </div>
            <span class="menu-text">Đơn hàng</span>
            <b class="menu-count">12</b>
          </button>
          <button class="menu-item" data-title="Sản phẩm" data-page="sanPham">
            <div class="menu-icon flexRow-center">
              <i class="ri-box-3-line"></i>
            </div>
            <span class="menu-text">Sản phẩm</span>
          </button>
          <button
            class="menu-item"
            data-title="Khách hàng"
            data-page="khachHang"
          >
            <div class="menu-icon flexRow-center">
              <i class="ri-user-line"></i>
            </div>
            <span class="menu-text">Khách hàng</span>
          </button>
          <button
            class="menu-item"
            data-title="Khuyến mãi"
            data-page="khuyenMai"
          >
            <div class="menu-icon flexRow-center">
              <i class="ri-price-tag-3-line"></i>
            </div>
            <span class="menu-text">Khuyến mãi</span>
          </button>

          <p class="menu-label">HỆ THỐNG</p>
          <button class="menu-item" data-title="Cài đặt" data-page="caiDat">
            <div class="menu-icon flexRow-center">
              <i class="ri-settings-4-line"></i>
            </div>
            <span class="menu-text">Cài đặt</span>
          </button>
        </nav>

        <button class="collapse-button" id="collapseButton">
          <span class="collapse-arrow">‹</span>
          <span class="collapse-text">Thu gọn menu</span>
        </button>
      </aside>

      <main class="main-content">
        <header class="header">
          <button class="mobile-menu" id="mobileMenu">☰</button>
          <div>
            <h1 id="pageTitle">Tổng quan</h1>
            <p>Xin chào, chúc bạn một ngày làm việc hiệu quả!</p>
          </div>

          <div class="admin-info">
            <span>AN</span>
            <div>
              <strong>Admin Nguyễn</strong>
              <small>Quản trị viên</small>
            </div>
          </div>
        </header>

        <div class="page-content" id="pageContent"></div>
      </main>
    </div>

    <div class="message" id="message"></div>

    <script
      src="https://kit.fontawesome.com/6abea2bdfc.js"
      crossorigin="anonymous"
    ></script>
    <script src="../js/service.js"></script>
    <script src="../js/innerHtml.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
