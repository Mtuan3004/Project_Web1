<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VetCare Admin Center</title>
    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- CSS (Lùi ra 1 cấp) -->
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body class="admin-root">
    <div id="app-root"></div>
    <div id="modal-root"></div>

    <!-- JS Core & Modules (Lùi ra 1 cấp) -->
    <script src="../js/core/storage.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/header.js"></script>
    <script src="../js/components/modal.js"></script>
    <script src="../js/pages/auth.js"></script>
    <script src="../js/pages/dashboard.js"></script>
    <script src="../js/pages/products.js"></script>
    <script src="../js/pages/categories.js"></script>
    <script src="../js/pages/purchases.js"></script>
    <script src="../js/pages/pricing.js"></script>
    <script src="../js/pages/stock.js"></script>
    <script src="../js/pages/orders.js"></script>
    <script src="../js/pages/users.js"></script>

    <script>
      const state = {
        currentTab: "admin-dashboard",
      };

      function navigateTo(tab) {
        state.currentTab = tab;
        renderApp();
      }

      function renderApp() {
        if (!localStorage.getItem("vet_admin_logged")) {
          window.location.href = "signUpAdmin.html";
          return;
        }

        const root = document.getElementById("app-root");
        if (!root) return;
        root.innerHTML = "";

        const container = document.createElement("div");
        container.className = "admin-root admin-layout";
        container.appendChild(renderSidebar());

        const mainContent = document.createElement("main");
        mainContent.className = "main-content";
        mainContent.appendChild(renderHeader());

        const pageContent = document.createElement("div");
        pageContent.className = "admin-page-content";

        if (state.currentTab === "admin-dashboard")
          pageContent.appendChild(renderAdminDashboard());
        else if (state.currentTab === "admin-users")
          pageContent.appendChild(renderAdminUsers());
        else if (state.currentTab === "admin-categories")
          pageContent.appendChild(renderAdminCategories());
        else if (state.currentTab === "admin-products")
          pageContent.appendChild(renderAdminProducts());
        else if (state.currentTab === "admin-purchases")
          pageContent.appendChild(renderAdminPurchases());
        else if (state.currentTab === "admin-pricing")
          pageContent.appendChild(renderAdminPricing());
        else if (state.currentTab === "admin-orders")
          pageContent.appendChild(renderAdminOrders());
        else if (state.currentTab === "admin-stock")
          pageContent.appendChild(renderAdminStock());

        mainContent.appendChild(pageContent);
        container.appendChild(mainContent);
        root.appendChild(container);
      }

      window.addEventListener("DOMContentLoaded", () => {
        renderApp();
      });
    </script>
  </body>
</html>
