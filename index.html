<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PETPET</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
    <!----------->

    <!-- CSS -->
    <link rel="stylesheet" href="./src/css/main.css" />
    <link rel="stylesheet" href="./src/css/utilities.css" />
    <!--------->
  </head>
  <body>
    <div class="Destop-layout">
      <!-- Topbar -->
      <header class="header">
        <div class="topbar flexRow-center site-container">
          <nav class="topbar-items flexRow-center">
            <img
              src="./src/img/icon/sprite-pet-both-icon.svg"
              alt="icon-branch"
              id="iconBranch"
            />
            <span translate="no">Liên hệ : 1900 3305</span>
            <img
              src="./src/img/icon/sprite-pet-both-icon.svg"
              alt="icon-branch"
              id="iconBranch"
            />
            <span class="slogan">cửa hàng thú cưng</span>
            <img
              src="./src/img/icon/sprite-pet-both-icon.svg"
              alt="icon-branch"
              id="iconBranch"
            />
            <span>Hệ Thống Cửa Hàng</span>
            <img
              src="./src/img/icon/sprite-pet-both-icon.svg"
              alt="icon-branch"
              id="iconBranch"
            />
          </nav>
        </div>
      </header>
      <!------------>
      <!-- Navigation -->
      <nav class="navbar site-container">
        <div class="left-bar flexRow-center">
          <div class="logo">
            <img src="./src/img/icon/logo_headerDesktop.svg" alt="icon" />
          </div>
          <div class="nav-item"><a href="#Trangchủ">Trang chủ</a></div>
          <div class="nav-item"><a href="#Giớithiệu">Giới thiệu</a></div>
          <div class="nav-item"><a href="#Sảnphẩm">Sản phẩm</a></div>
          <div class="nav-item"><a href="#Thươnghiệu">Thương hiệu</a></div>
          <div class="nav-item"><a href="#Tạpchí">Tạp chí</a></div>
        </div>
        <div class="right-bar flexRow-center">
          <div class="search">
            <div class="left-search-icon">
              <img
                id="icon-search-dog"
                src="./src/img/icon/sprite-pet-dog-sticker.svg"
                alt=""
              />
            </div>
            <div class="right-search-icon">
              <img
                id="icon-search-cat"
                src="./src/img/icon/sprite-pet-cat-sticker.svg"
                alt=""
              />
            </div>
            <input
              class="text-search"
              type="text"
              placeholder="Tìm thức ăn và phụ kiện"
            />
          </div>
          <div class="icon-set">
            <button type="button" class="btn flexRow-center" id="mainPetBtn">
              <div class="btn-icon-wrapper">
                <img
                  src="./src/img/icon/sprite-pet-switch-both.svg"
                  alt=""
                  id="switchIcon"
                />
              </div>
              <div class="btn-content flexRow-center">
                <span id="btnText">Pet cưng</span>
                <i class="ri-arrow-drop-down-line"></i>
              </div>
            </button>
            <div class="dropdown-icon">
              <ul>
                <li>
                  <button
                    type="button"
                    class="btn flexRow-center"
                    id="switchBtn"
                    data-pet="both"
                  >
                    <div class="btn-icon-wrapper">
                      <img
                        src="./src/img/icon/sprite-pet-switch-both.svg"
                        alt=""
                        id="switchIcon"
                      />
                    </div>
                    <div class="btn-content flexRow-center">
                      <span>Pet cưng</span>
                    </div>
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    class="btn flexRow-center"
                    id="switchBtn"
                    data-pet="dog"
                  >
                    <div class="btn-icon-wrapper">
                      <img
                        src="./src/img/icon/sprite-pet-switch-dog.svg"
                        alt=""
                        id="switchIcon"
                      />
                    </div>
                    <div class="btn-content flexRow-center">
                      <span>Cún cưng</span>
                    </div>
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    class="btn flexRow-center"
                    id="switchBtn"
                    data-pet="cat"
                  >
                    <div class="btn-icon-wrapper">
                      <img
                        src="./src/img/icon/sprite-pet-switch-cat.svg"
                        alt=""
                        id="switchIcon"
                      />
                    </div>
                    <div class="btn-content flexRow-center">
                      <span>Mèo cưng</span>
                    </div>
                  </button>
                </li>
              </ul>
            </div>
          </div>
          <!-- SignUp - SignIn -->
          <div class="account flexRow-center">
            <i class="ri-user-line"></i>
            <div class="account-menu">
              <div class="account-top">
                <div class="account-menu__header flexRow-center">
                  <div class="avatar">
                    <img
                      src="./src/img/Avatar-icon.png"
                      alt="Avatar flexRow-center"
                    />
                  </div>
                  <div class="account-header-text">
                    <div class="account-text">
                      <h3 class="h2-text">Xin Chào!</h3>
                      <div class="role">
                        <span>Đăng nhập để trải nghiệm đầy đủ tính năng</span>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="account-menu__auth">
                  <button class="sign-up" id="signUp">
                    <span>Đăng nhập</span>
                  </button>
                  <button class="sign-in" id="signIn">
                    <span>Đăng kí</span>
                  </button>
                </div>
              </div>
              <div class="account-main">
                <div class="personal-menu">
                  <div class="prefenrence-icon">
                    <i class="ri-receipt-line"></i>
                  </div>
                  <span>Đơn hàng của tôi</span>
                </div>
                <div class="personal-menu">
                  <div class="prefenrence-icon">
                    <i class="ri-heart-line"></i>
                  </div>
                  <span>Yêu thích</span>
                </div>
                <div class="personal-menu">
                  <div class="prefenrence-icon">
                    <i class="ri-notification-2-line"></i>
                  </div>
                  <span>Thông báo</span>
                </div>
              </div>
              <div class="account-footer">
                <div class="personal-menu">
                  <div class="prefenrence-icon">
                    <i class="ri-settings-4-line"></i>
                  </div>
                  <span>Cài đặt tài khoản</span>
                </div>
                <div class="personal-menu">
                  <div class="prefenrence-icon">
                    <i class="ri-logout-box-r-line"></i>
                  </div>
                  <span>Đăng xuất</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </nav>
      <!-- Image Slider -->
      <div class="site-container">
        <div class="img-slider">
          <div class="slider" id="slider">
            <img src="src/img/slider img/BANNER FREESHIP_thumb.webp" alt="" />
            <img src="src/img/slider img/Horizontal Banner_thumb.webp" alt="" />
            <img
              src="src/img/slider img/banner-pate-cun-desktop-v2_thumb.webp"
              alt=""
            />
            <img
              src="src/img/slider img/HERO BANNER THỨ 4 MỞ APP_thumb.webp"
              alt=""
            />
          </div>
          <button
            type="button"
            class="slider-btn prev flexRow-center"
            onclick="prev()"
            aria-label="Ảnh trước"
          >
            <i class="ri-arrow-left-s-line"></i>
          </button>
          <button
            type="button"
            class="slider-btn next flexRow-center"
            onclick="next()"
            aria-label="Ảnh sau"
          >
            <i class="ri-arrow-right-s-line"></i>
          </button>
        </div>
      </div>

      <!------------>
    </div>
    <!-- Account -->
    <!-- JS -->
    <script src="./src/js/main.js"></script>
    <!--------->
  </body>
</html>
